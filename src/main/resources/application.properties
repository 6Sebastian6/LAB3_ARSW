spring.mvc.pathmatch.matching-strategy=ant_path_matcher

# --- Conexion a PostgreSQL (levantada con docker compose up -d) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/blueprintsdb
spring.datasource.username=blueprints
spring.datasource.password=blueprints
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
# update: crea/actualiza las tablas automaticamente a partir de las @Entity (comodo para el lab)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect